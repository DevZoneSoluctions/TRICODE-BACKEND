<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TRICODE Backend API</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0F172A; color: #F8FAFC; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .box { background: #1E293B; border: 1px solid #334155; border-radius: 16px; padding: 40px; text-align: center; max-width: 440px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .badge { display: inline-block; background: #064E3B; color: #34D399; font-size: 12px; font-weight: 700; padding: 4px 12px; border-radius: 99px; margin-bottom: 16px; text-transform: uppercase; letter-spacing: 1px; }
    h1 { margin: 0 0 12px; font-size: 24px; color: #fff; }
    p { margin: 0; color: #94A3B8; font-size: 14px; line-height: 1.6; }
    code { background: #0F172A; padding: 2px 6px; border-radius: 4px; color: #38BDF8; font-size: 13px; }
  </style>
</head>
<body>
  <div class="box">
    <div class="badge">● Operational</div>
    <h1>TRICODE AI Backend</h1>
    <p>Serverless Contact API is active and ready.<br>POST requests to <code>/api/contact</code></p>
  </div>
</body>
</html>
